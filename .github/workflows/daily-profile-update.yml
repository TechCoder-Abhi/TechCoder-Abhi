
name: Daily Profile Update

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Checkout repository using your personal token
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      # Generate GitHub Metrics
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: TechCoder-Abhi
          filename: github-metrics.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_output: svg

          retries: 1
          retries_delay: 0
          plugins_errors_fatal: yes

          base: header, activity, community, repositories, metadata
          repositories: 30
          repositories_batch: 25

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github

          plugin_lines: no
          plugin_stars: no
          plugin_isocalendar: no

          # Generate without creating a separate commit
          output_action: none

      # Generate LeetCode Metrics
      - name: Generate LeetCode Metrics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: TechCoder-Abhi
          filename: metrics.plugin.leetcode.svg

          base: ""
          config_output: svg

          retries: 1
          retries_delay: 0

          plugin_leetcode: yes
          plugin_leetcode_user: Abhijit_Codes
          plugin_leetcode_sections: solved, skills, recent

          # Generate without creating a separate commit
          output_action: none

      # Generate 3D Contribution Graph
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: TechCoder-Abhi
        with:
          github_user_name: TechCoder-Abhi

      # Copy both metrics files into the repository
      - name: Collect Generated Metrics
        run: |
          sudo cp -f /metrics_renders/github-metrics.svg .
          sudo cp -f /metrics_renders/metrics.plugin.leetcode.svg .

      # Create ONE commit for everything
      - name: Commit and Push All Updates
        run: |
          git config user.name "TechCoder-Abhi"
          git config user.email "abhijitmondalworld@gmail.com"

          git add -- \
            github-metrics.svg \
            metrics.plugin.leetcode.svg \
            profile-3d-contrib/

          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily profile stats"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
